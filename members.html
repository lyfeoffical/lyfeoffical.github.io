<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ไลฟ์สไตล์.com</title>
  <link rel="icon" type="image/png" href="https://img1.pic.in.th/images/3004g.png">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&family=Bebas+Neue&family=Sarabun:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #030303;
      --surface-color: rgba(255, 255, 255, 0.02);
      --surface-border: rgba(255, 255, 255, 0.05);
      --surface-hover: rgba(255, 255, 255, 0.05);
      --accent: #ffffff;
      --accent-glow: rgba(255, 255, 255, 0.25);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --text-muted: rgba(255, 255, 255, 0.4);
      --nav-font: 'Bebas Neue', sans-serif;
      --heading-font: 'Kanit', sans-serif;
      --body-font: 'Sarabun', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: var(--bg-color);
      color: var(--text-primary);
      font-family: var(--body-font);
      overflow-x: hidden;
      min-height: 100vh;
      opacity: 0;
      transition: opacity 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    body.loaded {
      opacity: 1;
    }

    /* 🔹 Background System (GIF + Blur) */
    .bg-animation {
      position: fixed;
      inset: 0;
      z-index: -3;
      background: url('background.gif') center/cover no-repeat;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: rgba(3, 3, 3, 0.75);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .bg-vignette {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at center, transparent 30%, rgba(3, 3, 3, 0.95) 100%);
      pointer-events: none;
    }

    /* 🔹 Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #030303; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

    /* 🔹 Navbar */
    header {
      background: rgba(3, 3, 3, 0.25);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      padding: 18px 5%;
      position: fixed;
      width: 100%;
      top: 0;
      border-bottom: 1px solid var(--surface-border);
      z-index: 1000;
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .navbar { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; }
    
    .logo img {
      height: 42px;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.15));
      display: block;
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .logo a {
      display: inline-block;
      text-decoration: none;
    }
    .logo a:hover img {
      transform: scale(1.05);
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.35));
    }
    
    nav ul { list-style: none; display: flex; gap: 40px; }
    
    nav a {
      color: var(--text-secondary);
      text-decoration: none;
      font-family: var(--nav-font);
      font-size: 1.05rem;
      letter-spacing: 2px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
      padding: 6px 0;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background: var(--accent);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      transform: translateX(-50%);
      box-shadow: 0 0 12px rgba(255,255,255,0.8);
    }

    nav a:hover::after, nav a.active::after {
      width: 100%;
    }

    nav a:hover, nav a.active {
      color: var(--accent);
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    /* 🔹 Main UI */
    .container { max-width: 1200px; margin: 150px auto 100px; padding: 0 30px; }
    
    .title-section h1 {
      font-family: var(--heading-font);
      font-size: clamp(3rem, 8vw, 4.5rem);
      letter-spacing: 12px;
      font-weight: 700;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 12px;
      text-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .underline-glow {
      width: 100px;
      height: 3px;
      background: #fff;
      margin: 0 auto 60px;
      box-shadow: 0 0 20px #fff;
    }

    /* 🔹 Search Bar */
    .search-wrapper { display: flex; justify-content: center; margin-bottom: 60px; }
    
    .search-bar {
      width: 100%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 100px;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .search-bar:focus-within {
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.06);
    }

    .search-bar i {
      color: var(--text-secondary);
      font-size: 1.1rem;
    }

    .search-bar input {
      background: transparent;
      border: none;
      color: #fff;
      width: 100%;
      outline: none;
      margin-left: 15px;
      font-family: var(--heading-font);
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .search-bar input::placeholder {
      color: var(--text-muted);
    }

    /* 🔹 Members Grid — 4 คอลัมน์ × 2 แถว = 8 คน/หน้า */
    .members-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px;
      min-height: 400px;
    }

    .member-card {
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 25px;
      padding: 50px 20px;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    
    /* เอฟเฟกต์แสงวิ่งสไลด์ผ่านการ์ดเมื่อ Hover */
    .member-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
      transform: skewX(-25deg);
      transition: 0.75s;
      pointer-events: none;
    }
    
    .member-card:hover {
      transform: translateY(-12px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 255, 255, 0.08);
    }
    
    .member-card:hover::before {
      left: 150%;
    }

    .member-avatar {
      width: 90px;
      height: 90px;
      background: radial-gradient(circle at center, #222, #050505);
      border-radius: 50%;
      margin: 0 auto 25px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.2rem;
      font-family: 'Bebas Neue';
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
      transition: all 0.4s ease;
      overflow: hidden;
    }
    
    .member-card:hover .member-avatar {
      border-color: #fff;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.25);
      transform: scale(1.05);
    }
    
    .member-name {
      font-family: var(--heading-font);
      margin-bottom: 25px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      transition: color 0.3s ease, text-shadow 0.3s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      display: block;
    }
    
    .member-card:hover .member-name {
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }
    
    .contact-link {
      display: inline-block;
      background: #fff;
      color: #000;
      text-decoration: none;
      padding: 10px 30px;
      border-radius: 50px;
      font-family: 'Bebas Neue';
      font-size: 1rem;
      letter-spacing: 2px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
    }
    
    .contact-link:hover {
      background: transparent;
      color: #fff;
      box-shadow: inset 0 0 0 1.5px #fff, 0 0 20px rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    
    .contact-link:active {
      transform: translateY(0);
    }
    
    .contact-link.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      box-shadow: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
    }

    /* 🔹 Pagination */
    .pagination-fancy { display: flex; justify-content: center; align-items: center; gap: 30px; margin-top: 80px; }
    
    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: 'Bebas Neue';
      font-size: 1.25rem;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    
    .nav-btn:hover:not(.disabled) {
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }
    
    .nav-btn.disabled { opacity: 0.2; cursor: not-allowed; }

    /* 🔹 Volume Container Main Style */
    .volume-container {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 8px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 50px;
      width: 50px;
      height: 50px;
      transition: width 0.5s cubic-bezier(0.25, 0.8, 0.25, 1), background 0.3s, border-color 0.3s;
      overflow: hidden;
      cursor: pointer;
    }

    .volume-container:hover {
      width: 200px;
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 15px rgba(255, 255, 255, 0.05);
    }

    .volume-content {
      display: flex;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    .vol-icon-box {
      min-width: 34px;
      height: 34px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      transition: 0.3s;
    }

    .vol-icon-box i {
      color: #fff;
      font-size: 1.05rem;
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
    }

    .slider-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      padding-right: 15px;
      opacity: 0;
      transform: translateX(-10px);
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      pointer-events: none;
    }

    .volume-container:hover .slider-wrapper {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      outline: none;
      cursor: pointer;
      margin-left: 10px;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
      transition: transform 0.2s;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    /* 🔹 Anti-Devtools Popup */
    #block-popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 3, 3, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      justify-content: center;
      align-items: center;
      z-index: 999999;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    #block-popup .box {
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.02);
      color: #fff;
      padding: 35px 70px;
      border-radius: 20px;
      font-family: var(--nav-font);
      font-size: 2.2rem;
      letter-spacing: 6px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: alertBlink 1.5s infinite alternate ease-in-out;
    }

    /* 🔹 Mobile Menu CSS */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      z-index: 1100;
    }
    
    .hamburger span {
      width: 28px;
      height: 2px;
      background: #fff;
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    
    /* Animation ตอนกด Hamburger */
    .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 6px); }
    .hamburger.active span:nth-child(2) { opacity: 0; }
    .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -6px); }
    
    .mobile-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      height: 100vh;
      background: rgba(3, 3, 3, 0.98);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 40px;
      transition: right 0.6s cubic-bezier(0.77, 0, 0.175, 1);
      z-index: 1050;
    }
    .mobile-menu.active { right: 0; }
    .mobile-menu a {
      color: #fff;
      font-family: var(--nav-font);
      font-size: 2.2rem;
      text-decoration: none;
      letter-spacing: 5px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .mobile-menu a:hover { transform: scale(1.08); text-shadow: 0 0 20px rgba(255, 255, 255, 0.6); }
    
    /* Responsive: แสดง Hamburger และปรับแต่งเลย์เอาต์บนมือถือ */
    @media (max-width: 768px) {
      .nav-desktop { display: none; }
      .hamburger { display: flex; }
      
      .container {
          margin: 100px auto 60px;
          padding: 0 20px;
      }
      
      .title-section h1 {
          font-size: 2.8rem;
          letter-spacing: 8px;
      }
      
      .search-wrapper {
          margin-bottom: 40px;
      }
      
      .members-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 16px;
      }
      
      .member-card {
          padding: 28px 12px;
      }
      
      .pagination-fancy {
          margin-top: 50px;
          gap: 20px;
      }
      
      .volume-container {
          bottom: 20px;
          right: 20px;
      }
    }
    
    @media (max-width: 480px) {
      .title-section h1 {
          font-size: 2.2rem;
          letter-spacing: 5px;
      }
      .members-grid {
          grid-template-columns: 1fr 1fr;
          gap: 12px;
      }
      .member-avatar {
          width: 70px;
          height: 70px;
          font-size: 1.8rem;
          margin-bottom: 15px;
      }
      .member-name {
          font-size: 0.85rem !important;
          margin-bottom: 15px;
      }
      .contact-link {
          padding: 7px 18px;
          font-size: 0.82rem;
      }
    }

    /* 🔹 Popup Overlay */
    .popup-overlay {
        position: fixed;
        inset: 0;
        background: rgba(3, 3, 3, 0.85);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        z-index: 9999;
        display: none;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    
    /* 🔹 Popup Content */
    .popup-content {
        background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(3,3,3,0.95) 100%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        width: 90%;
        max-width: 480px;
        padding: 55px 35px;
        border-radius: 28px;
        position: relative;
        text-align: center;
        transform: scale(0.9) translateY(20px);
        transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 30px rgba(255,255,255,0.05);
    }
    
    .popup-overlay.active { display: flex; opacity: 1; }
    .popup-overlay.active .popup-content { transform: scale(1) translateY(0); }
    
    /* 🔹 ปุ่มกากบาท */
    .close-popup {
        position: absolute;
        top: 20px;
        right: 25px;
        background: transparent;
        border: none;
        color: #fff;
        font-size: 2.2rem;
        cursor: pointer;
        opacity: 0.4;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .close-popup:hover { opacity: 1; transform: rotate(90deg); }
    
    /* 🔹 องค์ประกอบภายใน */
    .music-icon-wrapper i {
        font-size: 4.5rem;
        color: #fff;
        margin-bottom: 25px;
        text-shadow: 0 0 25px rgba(255, 255, 255, 0.35);
    }
    
    .fa-spin-slow {
        animation: fa-spin 6s linear infinite;
    }
    
    .popup-inner h2 {
        font-family: 'Bebas Neue';
        font-size: 2.8rem;
        letter-spacing: 5px;
        margin-bottom: 15px;
        background: linear-gradient(to right, #fff, #888, #fff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    
    .popup-inner p {
        font-family: var(--body-font);
        color: var(--text-secondary);
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 30px;
    }
    
    .order-btn-popup {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: #fff;
        color: #000;
        padding: 12px 35px;
        border-radius: 50px;
        text-decoration: none;
        font-family: 'Bebas Neue';
        font-size: 1.2rem;
        transition: 0.3s;
    }
    .order-btn-popup:hover {
        background: #000;
        color: #fff;
        box-shadow: inset 0 0 0 1px #fff;
    }
    
    /* สไตล์สำหรับลิงก์ชื่อใน Popup */
    .contact-name-link {
        color: #fff;
        text-decoration: none;
        font-weight: bold;
        border-bottom: 1px dashed rgba(255,255,255,0.5);
        transition: 0.3s;
        padding: 0 5px;
    }
    
    .contact-name-link:hover {
        color: var(--text-muted);
        border-bottom: 1px solid #fff;
        text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    /* 🔹 Card Fade-in Animation */
    @keyframes premiumFadeIn {
        from {
            opacity: 0;
            transform: translateY(20px) scale(0.97);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    @keyframes alertBlink {
        0% { border-color: rgba(255, 255, 255, 0.1); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
        100% { border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 255, 0.15); }
    }
  </style>
</head>
<body>
  <div class="bg-animation"></div>
  <div class="bg-overlay"></div>
  <div class="bg-vignette"></div>
  <div id="block-popup">
    <div class="box">SYSTEM PROTECTED</div>
  </div>



<header id="mainHeader">
  <div class="navbar">
    <div class="logo">
      <a href="index.html"><img src="https://img1.pic.in.th/images/3004g.png" alt="Logo"></a>
    </div>
    
    <nav class="nav-desktop">
      <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="members.html" class="active">MEMBERS</a></li>
        <li><a href="official.html">OFFICIAL</a></li>
      </ul>
    </nav>

    <div class="hamburger" id="hamburgerBtn">
      <span></span><span></span><span></span>
    </div>
  </div>
</header>

<div class="mobile-menu" id="mobileMenu">
  <a href="index.html">HOME</a>
  <a href="members.html">MEMBERS</a>
  <a href="official.html">OFFICIAL</a>
</div>

  <div class="container">
    <div class="title-section">
        <h1>GANG MEMBER</h1>
     <div class="underline-glow"></div>
    </div>

    <div id="musicPopup" class="popup-overlay">
    <div class="popup-content">
        <button class="close-popup" id="closePopup">&times;</button>
        <div class="popup-inner">
            <div class="music-icon-wrapper">
                <i class="fa-solid fa-compact-disc fa-spin-slow"></i>
            </div>
            <h2>GANG MUSIC SERVICE</h2>
            <p>รับทำเพลงแก๊งทุกแนว สนใจติดต่อ <br> 
                <a href="https://web.facebook.com/personslat" target="_blank" class="contact-name-link">Jason Lyfestyle</a>
            </p>
        </div>
    </div>
</div>

    <div class="search-wrapper">
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="SEARCH NAME...">
        </div>
    </div>

    <div class="members-grid" id="memberGrid"></div>

    <div class="pagination-fancy">
        <button id="prevBtn" class="nav-btn">BACK</button>
        <div class="page-indicator" style="font-family: 'Bebas Neue';">PAGE <span id="pageNum">1</span></div>
        <button id="nextBtn" class="nav-btn">NEXT</button>
    </div>
  </div>

  <div class="volume-container" id="volumeContainer">
    <div class="volume-content">
      <div class="vol-icon-box" onclick="toggleMute()">
        <i class="fa-solid fa-volume-high" id="volIcon"></i>
      </div>
      <div class="slider-wrapper">
        <input type="range" class="volume-slider" id="volSlider" min="0" max="1" step="0.01" value="0.5">
      </div>
    </div>
  </div>

  <audio id="bgMusic" loop src="music.mp3"></audio>

  <script src="members.js"></script>
  <script>
    // 2. สถานะเริ่มต้น
    let currentPage = 1;
    const perPage = 8;
    let filteredList = [...members];

    const grid = document.getElementById("memberGrid");
    const searchInput = document.getElementById("searchInput");
    const pageNumText = document.getElementById("pageNum");

    // 3. ฟังก์ชัน Render Card
    function renderCards() {
        grid.innerHTML = "";
        const start = (currentPage - 1) * perPage;
        const end = start + perPage;
        const pageItems = filteredList.slice(start, end);

        if (pageItems.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; opacity:0.5; padding: 50px 0; font-family: var(--heading-font); letter-spacing: 2px;">NO MEMBERS FOUND</div>`;
        }

        pageItems.forEach((m, index) => {
            const delay = index * 0.08;
            const contactBtn = m.fb 
                ? `<a href="${m.fb}" target="_blank" class="contact-link">FACEBOOK</a>` 
                : `<span class="contact-link disabled">NO CONTACT</span>`;
            
            // ปรับขนาดฟอนต์แบบไดนามิกตามความยาวของชื่อ เพื่อให้อยู่ในบรรทัดเดียวและเท่ากันหมด
            const nameLen = m.name.length;
            let fSize = "1.25rem";
            if (nameLen > 25) {
                fSize = "0.9rem";
            } else if (nameLen > 18) {
                fSize = "1.05rem";
            }

            const avatarContent = m.img 
                ? `<img src="${m.img}" alt="${m.name}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">` 
                : m.name.charAt(0);

            grid.innerHTML += `
                <div class="member-card" style="animation: premiumFadeIn 0.6s cubic-bezier(0.25, 0.8, 0.25, 1) forwards ${delay}s; opacity: 0;">
                    <div class="member-avatar">${avatarContent}</div>
                    <div class="member-name" style="font-size: ${fSize};" title="${m.name}">${m.name}</div>
                    ${contactBtn}
                </div>`;
        });

        pageNumText.innerText = currentPage;
        updatePaginationButtons();
    }

    // 4. ระบบค้นหา
    searchInput.addEventListener("input", (e) => {
        const term = e.target.value.toLowerCase().trim();
        filteredList = members.filter(m => m.name.toLowerCase().includes(term));
        currentPage = 1;
        renderCards();
    });

    // 5. ระบบเลื่อนหน้า
    function updatePaginationButtons() {
        document.getElementById("prevBtn").classList.toggle("disabled", currentPage === 1);
        document.getElementById("nextBtn").classList.toggle("disabled", currentPage * perPage >= filteredList.length);
    }

    document.getElementById("prevBtn").onclick = () => { if(currentPage > 1) { currentPage--; renderCards(); window.scrollTo({top: 0, behavior: 'smooth'}); } };
    document.getElementById("nextBtn").onclick = () => { if(currentPage * perPage < filteredList.length) { currentPage++; renderCards(); window.scrollTo({top: 0, behavior: 'smooth'}); } };

    // 🔹 ระบบ Persistent Audio (เล่นต่อเนื่อง)
    const music = document.getElementById("bgMusic");
    const volSlider = document.getElementById("volSlider");
    const volIcon = document.getElementById("volIcon");

    // ฟังก์ชันอัปเดต UI แถบเสียง
    function updateSliderUI(v) {
        const p = v * 100;
        if(volSlider) {
            volSlider.value = v;
            volSlider.style.background = `linear-gradient(90deg, #fff ${p}%, rgba(255,255,255,0.1) ${p}%)`;
        }
        if(volIcon) {
            if (v == 0) volIcon.className = "fa-solid fa-volume-xmark";
            else if (v < 0.5) volIcon.className = "fa-solid fa-volume-low";
            else volIcon.className = "fa-solid fa-volume-high";
        }
    }

    // 🔹 ระบบ Mute / Unmute
    function toggleMute() {
        const isMuted = localStorage.getItem("musicMuted") === "true";
        const savedVol = localStorage.getItem("musicVol") || 0.5;
        
        if (!isMuted && music.volume > 0) {
            music.dataset.oldVol = music.volume;
            music.volume = 0;
            localStorage.setItem("musicMuted", "true");
            updateSliderUI(0);
        } else {
            const restoreVol = music.dataset.oldVol || parseFloat(savedVol) || 0.5;
            music.volume = restoreVol;
            localStorage.setItem("musicMuted", "false");
            localStorage.setItem("musicVol", restoreVol);
            updateSliderUI(restoreVol);
        }
    }

    if (volSlider) {
        volSlider.addEventListener("input", (e) => {
            const val = parseFloat(e.target.value);
            music.volume = val;
            localStorage.setItem("musicVol", val);
            localStorage.setItem("musicMuted", val === 0 ? "true" : "false");
            updateSliderUI(val);
        });
    }

    // บันทึกตำแหน่งเพลง
    setInterval(() => {
        if (!music.paused) {
            localStorage.setItem("musicTime", music.currentTime);
        }
    }, 1000);


    // 🔹 ระบบ Mobile Menu
    const hamburger = document.getElementById('hamburgerBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    
    if (hamburger && mobileMenu) {
        hamburger.onclick = () => {
            hamburger.classList.toggle('active');
            mobileMenu.classList.toggle('active');
            document.body.style.overflow = mobileMenu.classList.contains('active') ? 'hidden' : 'auto';
        };
    }

    // 🔹 Security: Anti-Devtools & Right Click
    function showBlockPopup() {
        const p = document.getElementById("block-popup");
        if (!p) return;
        p.style.display = "flex";
        setTimeout(() => p.style.opacity = "1", 10);
        setTimeout(() => {
            p.style.opacity = "0";
            setTimeout(() => p.style.display = "none", 300);
        }, 1500);
    }

    document.addEventListener('contextmenu', e => {
        e.preventDefault();
        showBlockPopup();
    });

    document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.keyCode === 83)) {
            e.preventDefault();
            showBlockPopup();
            return false;
        }
        if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            showBlockPopup();
            return false;
        }
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
            e.preventDefault();
            showBlockPopup();
            return false;
        }
        if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U' || e.keyCode === 85)) {
            e.preventDefault();
            showBlockPopup();
            return false;
        }
    }, false);

    // 🔹 Render on load (fallback for fast browsers where DOMContentLoaded already fired)
    renderCards();

    // 🔹 Main init block
    document.addEventListener("DOMContentLoaded", () => {
        document.body.classList.add("loaded");

        // Render cards (primary call)
        renderCards();

        // Audio setup
        const savedTime = localStorage.getItem("musicTime");
        const savedVol = localStorage.getItem("musicVol");
        const isMuted = localStorage.getItem("musicMuted") === "true";

        if (savedTime) music.currentTime = parseFloat(savedTime);
        let initialVol = savedVol ? parseFloat(savedVol) : 0.5;
        music.volume = isMuted ? 0 : initialVol;
        updateSliderUI(music.volume);

        music.play().catch(() => {
            document.addEventListener('click', () => music.play(), { once: true });
        });

        // Music Popup
        const popup = document.getElementById("musicPopup");
        const closeBtn = document.getElementById("closePopup");

        setTimeout(() => { popup.classList.add("active"); }, 1500);

        closeBtn.onclick = () => {
            popup.classList.remove("active");
            setTimeout(() => { popup.style.display = "none"; }, 500);
        };

        popup.onclick = (e) => {
            if (e.target === popup) closeBtn.onclick();
        };

        // Smooth Page Transitions
        const navLinks = document.querySelectorAll('nav a, .mobile-menu a, .logo a');
        navLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                if (this.hostname === window.location.hostname && !this.target) {
                    e.preventDefault();
                    const targetUrl = this.href;
                    document.body.style.opacity = '0';
                    setTimeout(() => { window.location.href = targetUrl; }, 500);
                }
            });
        });
    });
    // 🔹 Header Scroll Effect
    window.addEventListener('scroll', () => {
        const header = document.getElementById('mainHeader');
        if (!header) return;
        if (window.scrollY > 50) {
            header.style.padding = '12px 5%';
            header.style.background = 'rgba(3, 3, 3, 0.95)';
            header.style.borderBottomColor = 'rgba(255,255,255,0.08)';
        } else {
            header.style.padding = '18px 5%';
            header.style.background = 'rgba(3, 3, 3, 0.25)';
            header.style.borderBottomColor = 'rgba(255,255,255,0.05)';
        }
    });
  </script>
</body>

</html>
