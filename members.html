  <style>
    :root {
      --bg-color: #0e0e0e;

      --accent: #fffbfb;

      --text: #fff;
      --text-dim: #bbb;
      --heading-font: 'Kanit', sans-serif;
      --body-font: 'Sarabun', sans-serif;
      --nav-font: 'Bebas Neue', sans-serif;
    }

    * {
      margin: 0; padding: 0;
      box-sizing: border-box;
      font-family: var(--body-font);
    }

    body {
      background: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
    }

    /* 🔹 Navbar เหมือนหน้าแรก */
    header {
      background: rgba(14,14,14,0.85);
      backdrop-filter: blur(12px);
      padding: 12px 50px;
      position: sticky;
      top: 0;
      border-bottom: 1px solid #2a2a2a;
      z-index: 10;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo img {
      height: 40px;
      filter: drop-shadow(0 0 10px var(--accent-glow));
      transition: 0.3s;
    }
    .logo img:hover { transform: scale(1.05); }

    nav ul {
      list-style: none;
      display: flex;
      gap: 40px;
    }

    nav a {
      color: #ccc;
      font-family: var(--nav-font);
      text-decoration: none;
      font-size: 1.3rem;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
      transition: 0.3s;
    }

    nav a::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0%;
      height: 2px;
      background: var(--accent);
      transition: width 0.3s;
    }

    nav a:hover,
    nav a.active { color: #fff; }

    nav a:hover::after,
    nav a.active::after { width: 100%; }

    .title {
      text-align: center;
      font-size: 3rem;
      margin-top: 40px;
      font-family: 'Kanit', sans-serif;
    }

    .highlight {
      color: var(--accent);
      text-shadow: 0 0 15px var(--accent-glow);
    }

    .search-box {
      text-align: center;
      margin: 30px 0 40px;
    }

    .search-box input {
      width: 300px;
      padding: 12px 18px;

      border: 1px solid #333;
      outline: none;
      font-size: 15px;
      background: #121212;

    }

    table {

      margin-bottom: 30px;
      border-collapse: collapse;
      background: #151515;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      overflow: hidden;
    }

    
    th, td {

      text-align: left;

    th {

      color: var(--accent);
      font-family: 'Bebas Neue', sans-serif;

/* 🎧 Elegant Music Player */
.music-player {
  position: fixed;
  bottom: 25px;
  left: 25px;
  width: 280px;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 15px;
  border: 1px solid rgba(255, 255, 255, 0.17);
  box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
  z-index: 999;
}

.cover-container {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid rgba(255,255,255,0.7);
}

.music-cover {
  width: 100%;
  height: 100%;
  object-fit: cover;
  animation: rotateCover 4s linear infinite paused;
}

/* หมุนปกตอนเล่นเพลง */
@keyframes rotateCover {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.music-title {
  font-size: 14px;
  font-weight: bold;
  color: #ffffff;
  text-shadow: 0 0 5px black;
}

.controls {
  margin-top: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.controls i {
  font-size: 20px;
  cursor: pointer;
  color: #fff;
  transition: 0.2s;
}

.controls i:hover {
  transform: scale(1.2);
}

#trackBar {
  width: 140px;
  accent-color: #ffffff;
}

#block-popup {

    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;

  let filteredList = members;

  function renderTable() {
    body.innerHTML = "";

    const start = (currentPage - 1) * perPage;
    const pageItems = filteredList.slice(start, start + perPage);

    pageItems.forEach(m => {
      body.innerHTML += `
        <tr>
          <td>${m.name}</td>
          <td>${m.role}</td>
          <td><a href="${m.fb}" target="_blank" class="fb-btn"><i class="fa-brands fa-facebook-f"></i> facebook</a></td>
        </tr>`;
    });

    updateButtons();
  }

  function updateButtons() {
    prevBtn.classList.toggle("disabled", currentPage === 1);
    nextBtn.classList.toggle("disabled", currentPage * perPage >= filteredList.length);
  }

  prevBtn.onclick = () => {
    if (currentPage > 1) currentPage--;
    renderTable();
  };

  nextBtn.onclick = () => {
    if (currentPage * perPage < filteredList.length) currentPage++;
    renderTable();
  };

  searchInput.addEventListener("input", () => {
    const keyword = searchInput.value.toLowerCase();
    filteredList = members.filter(m => m.name.toLowerCase().includes(keyword));

    currentPage = 1;
    renderTable();
  });

const music = document.getElementById("music");
const playPause = document.getElementById("playPause");
const cover = document.getElementById("cover");
const trackBar = document.getElementById("trackBar");

// ▶ Play / Pause
playPause.addEventListener("click", () => {
  if (music.paused) {
    music.play();
    playPause.classList.replace("fa-play", "fa-pause");
    cover.style.animationPlayState = "running";
  } else {
    music.pause();
    playPause.classList.replace("fa-pause", "fa-play");
    cover.style.animationPlayState = "paused";
  }
});

// ⏱ Track Progress
music.addEventListener("timeupdate", () => {
  trackBar.value = (music.currentTime / music.duration) * 100;
});

// 🔘 Seek
trackBar.addEventListener("input", () => {
  music.currentTime = (trackBar.value / 100) * music.duration;
});

document.onkeydown = function(e) {
    if (e.keyCode == 123 ||
        (e.ctrlKey && e.shiftKey && e.keyCode == 73) ||
        (e.ctrlKey && e.shiftKey && e.keyCode == 74) ||
        (e.ctrlKey && e.keyCode == 85)) {

        showBlockPopup();
        return false;
    }
};

document.addEventListener('contextmenu', e => {
    e.preventDefault();
    showBlockPopup();
});

function showBlockPopup() {
    let popup = document.getElementById("block-popup");
    popup.style.display = "flex";

    setTimeout(() => {
        popup.style.opacity = "1";
    }, 10);

    setTimeout(() => {
        popup.style.opacity = "0";
        setTimeout(() => popup.style.display = "none", 400);
    }, 2000);
}
