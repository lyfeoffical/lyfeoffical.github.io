  <style>
    :root {

      --accent: #ffffff;

      --text: #ffffff;

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: var(--bg-color);
      color: var(--text);
      font-family: 'Sarabun', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* 🔹 Background System (GIF + Blur) */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -3;
      /* เปลี่ยน 'background.gif' เป็นชื่อไฟล์ GIF ของคุณ */
      background: url('background.gif') center/cover no-repeat;
    }

    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      background: rgba(0, 0, 0, 0.6); /* ปรับความมืด */
      backdrop-filter: blur(6px); /* ปรับความเบลอตรงนี้ */
      -webkit-backdrop-filter: blur(12px);
    }

    .bg-vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.8) 100%);
    }

    /* 🔹 Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0e0e0e; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
    #particles-js { position: fixed; inset: 0; z-index: -1; }

    /* 🔹 Navbar */
    header {
      background: rgba(8, 8, 8, 0.3);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 15px 5%;
      position: fixed;
      width: 100%;
      top: 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 1000;
      transition: 0.3s;

    .navbar { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; }
    .logo img { height: 40px; }
    nav ul { list-style: none; display: flex; gap: 35px; }
    nav a { color: var(--text-dim); text-decoration: none; font-family: var(--nav-font); font-size: 1.1rem; letter-spacing: 2px; transition: 0.3s; }
    nav a:hover, nav a.active { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }

    /* 🔹 Main UI */
    .container { max-width: 1200px; margin: 150px auto 100px; padding: 0 30px; }
    .title-section h1 { font-family: 'Bebas Neue'; font-size: clamp(3rem, 8vw, 4.5rem); letter-spacing: 15px; text-align: center; margin-bottom: 10px; }
    .underline-glow { width: 100px; height: 3px; background: #fff; margin: 0 auto 60px; box-shadow: 0 0 20px #fff; }

    /* 🔹 Search Bar */
    .search-wrapper { display: flex; justify-content: center; margin-bottom: 60px; }
    .search-bar {
        width: 100%; max-width: 500px; background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 100px;
        padding: 15px 25px; display: flex; align-items: center; backdrop-filter: blur(10px);
    }
    .search-bar input { background: transparent; border: none; color: #fff; width: 100%; outline: none; margin-left: 15px; font-family: 'Kanit'; letter-spacing: 1px; }

    /* 🔹 Members Grid */
    .members-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px;
        min-height: 400px; /* กัน Layout กระโดดตอนค้นหา */
    }
    .member-card {
        background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 25px; padding: 50px 20px; text-align: center;
        transition: 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .member-card:hover { transform: translateY(-15px); border-color: #fff; background: rgba(255, 255, 255, 0.07); }

    .member-avatar {
        width: 90px; height: 90px; background: linear-gradient(45deg, #111, #444);
        border-radius: 50%; margin: 0 auto 20px; display: flex;
        justify-content: center; align-items: center; font-size: 2.2rem;
        font-family: 'Bebas Neue'; border: 2px solid rgba(255,255,255,0.1);
    }
    .member-name { font-family: 'Kanit'; font-size: 1.2rem; margin-bottom: 25px; font-weight: 500; }
    .contact-link {
        display: inline-block; background: #fff; color: #000; text-decoration: none;
        padding: 10px 25px; border-radius: 50px; font-family: 'Bebas Neue'; font-size: 1rem; transition: 0.3s;
    }
    .contact-link:hover { background: transparent; color: #fff; box-shadow: inset 0 0 0 1px #fff; }

    /* 🔹 Pagination */
    .pagination-fancy { display: flex; justify-content: center; align-items: center; gap: 30px; margin-top: 80px; }
    .nav-btn { background: transparent; border: none; color: #666; font-family: 'Bebas Neue'; font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
    .nav-btn:hover:not(.disabled) { color: #fff; }
    .nav-btn.disabled { opacity: 0.2; cursor: not-allowed; }

    /* 🔹 Volume UI */
    .volume-container {
        position: fixed; bottom: 30px; right: 30px; z-index: 1001;
        display: flex; align-items: center; padding: 8px;
        background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50px;
        width: 50px; height: 50px; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); overflow: hidden;
    }
    .volume-container:hover { width: 200px; }
    .vol-icon-box { min-width: 34px; height: 34px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    .volume-slider { -webkit-appearance: none; width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 10px; outline: none; margin: 0 15px; cursor: pointer; }
    .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #fff; border-radius: 50%; }

/* 🔹 Anti-Devtools Popup */
    #block-popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(15px);
      justify-content: center;
      align-items: center;
      z-index: 999999;
      opacity: 0;
      transition: 0.3s;
    }

    #block-popup .box {
      border: 1px solid #fff;
      color: #fff;
      padding: 30px 60px;
      border-radius: 0px;
      font-family: var(--nav-font);
      font-size: 2rem;
      letter-spacing: 5px;
      text-align: center;
      box-shadow: 0 0 50px rgba(255,255,255,0.1);
    }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .particle-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    .dot {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      filter: blur(1px);
      animation: fly 10s linear infinite;
    }

    @keyframes fly {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    /* เอฟเฟกต์ตอนโหลดหน้าจอ */
body {
    opacity: 0;
    transition: opacity 0.6s ease-in-out;
}

body.loaded {
    opacity: 1;
}

/* Hover Effect ที่เมนูให้ดูสมูท */
nav ul li a {
    position: relative;
    padding-bottom: 5px;
    transition: color 0.3s ease;
}

nav ul li a::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 0;
    height: 2px;
    background: #fff;
    transition: all 0.3s ease;
    transform: translateX(-50%);
    box-shadow: 0 0 10px rgba(255,255,255,0.8);
}

nav ul li a:hover::after, 
nav ul li a.active::after {
    width: 100%;
}

nav ul li a:hover {
    color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
}

/* 🔹 Mobile Menu CSS */
.hamburger {
  display: none; /* ซ่อนในคอม */
  flex-direction: column;
  gap: 6px;
  cursor: pointer;
  z-index: 1100;
}
.hamburger span {
  width: 30px;
  height: 3px;
  background: #fff;
  transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* Animation ตอนกด Hamburger */
.hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(6px, 6px); }
.hamburger.active span:nth-child(2) { opacity: 0; }
.hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(6px, -7px); }

.mobile-menu {
  position: fixed;
  top: 0;
  right: -100%; /* ซ่อนไว้ทางขวา */
  width: 100%;
  height: 100vh;
  background: rgba(10, 10, 10, 0.98);
  backdrop-filter: blur(20px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 40px;
  transition: 0.5s cubic-bezier(0.77, 0, 0.175, 1);
  z-index: 1050;
}
.mobile-menu.active { right: 0; }
.mobile-menu a {
  color: #fff;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.2rem;
  text-decoration: none;
  letter-spacing: 5px;
  transition: 0.3s;
}
.mobile-menu a:hover { transform: scale(1.1); text-shadow: 0 0 15px #fff; }

/* Responsive: แสดง Hamburger เมื่อจอเล็ก */
@media (max-width: 768px) {
  .nav-desktop { display: none; }
  .hamburger { display: flex; }
}
/* 🔹 Popup Overlay */
.popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);

    z-index: 9999;
    display: none; /* เริ่มต้นซ่อนไว้ */
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: 0.5s ease;
}

/* 🔹 Popup Content */
.popup-content {
    background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.9) 100%);
    border: 1px solid rgba(255, 255, 255, 0.1);
    width: 90%;
    max-width: 500px;
    padding: 50px 30px;
    border-radius: 30px;
    position: relative;
    text-align: center;
    transform: scale(0.8);
    transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 50px rgba(255,255,255,0.1);
}

.popup-overlay.active { display: flex; opacity: 1; }
.popup-overlay.active .popup-content { transform: scale(1); }

/* 🔹 ปุ่มกากบาท */
.close-popup {
    position: absolute;
    top: 20px;
    right: 25px;
    background: transparent;
    border: none;
    color: #fff;

    cursor: pointer;

.close-popup:hover { opacity: 1; transform: rotate(90deg); }

    // 2. สถานะเริ่มต้น
    let currentPage = 1;
    const perPage = 8;
    let filteredList = [...members];

    const grid = document.getElementById("memberGrid");
    const searchInput = document.getElementById("searchInput");
    const pageNumText = document.getElementById("pageNum");

    // 3. ฟังก์ชัน Render Card
    function renderCards() {
        grid.innerHTML = "";
        const start = (currentPage - 1) * perPage;
        const end = start + perPage;
        const pageItems = filteredList.slice(start, end);

        if (pageItems.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; opacity:0.5;">NO MEMBERS FOUND</div>`;
        }

        pageItems.forEach((m, index) => {
            const delay = index * 0.1;
            grid.innerHTML += `
                <div class="member-card" style="animation: fadeInUp 0.5s ease forwards ${delay}s; opacity: 0;">
                    <div class="member-avatar">${m.name.charAt(0)}</div>
                    <div class="member-name">${m.name}</div>
                    <a href="${m.fb}" target="_blank" class="contact-link">FACEBOOK</a>
                </div>`;
        });

        pageNumText.innerText = currentPage;
        updatePaginationButtons();
    }

    // 4. ระบบค้นหา
    searchInput.addEventListener("input", (e) => {
        const term = e.target.value.toLowerCase();
        filteredList = members.filter(m => m.name.toLowerCase().includes(term));
        currentPage = 1;
        renderCards();
    });

      // ระบบป้องกันการเปิดดูโค้ดและเซฟหน้าเว็บ (อัปเดตใหม่)
  document.addEventListener('keydown', function(e) {
    // 1. ป้องกัน Ctrl + S (Save Page)
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.keyCode === 83)) {
        e.preventDefault();
        // showAlert("ไม่อนุญาตให้บันทึกหน้าเว็บ", "danger"); // เปิดใช้ถ้าต้องการให้แจ้งเตือน
        return false;
    }

    // 2. ป้องกัน F12 (DevTools)
    if (e.key === 'F12' || e.keyCode === 123) {
        e.preventDefault();
        return false;
    }

    // 3. ป้องกัน Ctrl + Shift + I / J / C (Inspect/Console)
    if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
        e.preventDefault();
        return false;
    }

    // 4. ป้องกัน Ctrl + U (View Source)
    if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U' || e.keyCode === 85)) {
        e.preventDefault();
        return false;
    }
}, false);

// 5. ป้องกันการคลิกขวา (Context Menu)
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
}, false);

    // 5. ระบบเลื่อนหน้า
    function updatePaginationButtons() {
        document.getElementById("prevBtn").classList.toggle("disabled", currentPage === 1);
        document.getElementById("nextBtn").classList.toggle("disabled", currentPage * perPage >= filteredList.length);
    }

    document.getElementById("prevBtn").onclick = () => { if(currentPage > 1) { currentPage--; renderCards(); window.scrollTo(0,0); } };
    document.getElementById("nextBtn").onclick = () => { if(currentPage * perPage < filteredList.length) { currentPage++; renderCards(); window.scrollTo(0,0); } };

    // 🔹 ระบบ Persistent Audio (เล่นต่อเนื่อง)
const music = document.getElementById("bgMusic");
const volSlider = document.getElementById("volSlider");
const volIcon = document.getElementById("volIcon");

// ฟังก์ชันอัปเดต UI แถบเสียง
function updateSliderUI(v) {
    const p = v * 100;
    if(volSlider) volSlider.value = v;
    if(volSlider) volSlider.style.background = `linear-gradient(90deg, #fff ${p}%, rgba(255,255,255,0.1) ${p}%)`;
    if(volIcon) volIcon.className = v == 0 ? "fa-solid fa-volume-xmark" : v < 0.5 ? "fa-solid fa-volume-low" : "fa-solid fa-volume-high";
}

// โหลดสถานะเพลงเมื่อเปิดหน้า
window.addEventListener("DOMContentLoaded", () => {
    const savedTime = localStorage.getItem("musicTime");
    const savedVol = localStorage.getItem("musicVol");
    const isMuted = localStorage.getItem("musicMuted") === "true";

    if (savedTime) music.currentTime = parseFloat(savedTime);
    
    // ตั้งค่าเสียง
    let initialVol = savedVol ? parseFloat(savedVol) : 0.5;
    music.volume = isMuted ? 0 : initialVol;
    updateSliderUI(music.volume);

    // พยายามเล่นเพลง (Browser มักจะบล็อกถ้ายังไม่มีการคลิก)
    const playPromise = music.play();
    if (playPromise !== undefined) {
        playPromise.catch(() => {
            console.log("รอการตอบโต้จากผู้ใช้เพื่อเล่นเพลง...");
            // ถ้าเล่นไม่ได้ ให้รอคลิกแรกของหน้าเว็บแล้วค่อยเล่น
            document.addEventListener('click', () => {
                music.play();
            }, { once: true });
        });
    }
});

// 🔹 ระบบ Popup Logic
document.addEventListener("DOMContentLoaded", () => {
    const popup = document.getElementById("musicPopup");
    const closeBtn = document.getElementById("closePopup");

    // แสดง Popup หลังจากหน้าโหลดเสร็จ 1.5 วินาที
    setTimeout(() => {
        popup.classList.add("active");
    }, 1500);

    // ปิดเมื่อกดปุ่ม X
    closeBtn.onclick = () => {
        popup.classList.remove("active");
        setTimeout(() => { popup.style.display = "none"; }, 500);
    };

    // ปิดเมื่อกดพื้นที่ว่าง (Overlay)
    popup.onclick = (e) => {
        if(e.target === popup) {
            closeBtn.onclick();
        }
    };
});

// 🔹 1. ระบบ Mobile Menu
const hamburger = document.getElementById('hamburgerBtn');
const mobileMenu = document.getElementById('mobileMenu');

hamburger.onclick = () => {
    hamburger.classList.toggle('active');
    mobileMenu.classList.toggle('active');
    // ป้องกันการเลื่อนหน้าจอตอนเปิดเมนู
    document.body.style.overflow = mobileMenu.classList.contains('active') ? 'hidden' : 'auto';
};

// บันทึกเวลาเพลงทุกๆ 1 วินาที
setInterval(() => {
    if (!music.paused) {
        localStorage.setItem("musicTime", music.currentTime);
    }
}, 1000);

// บันทึกค่าเมื่อมีการปรับเสียง
if(volSlider) {
    volSlider.oninput = (e) => {
        const v = e.target.value;
        music.volume = v;
        localStorage.setItem("musicVol", v);
        localStorage.setItem("musicMuted", v == 0);
        updateSliderUI(v);
    };
}

function toggleMute() {
    if (music.volume > 0) {
        music.dataset.lastVol = music.volume;
        music.volume = 0;
        localStorage.setItem("musicMuted", "true");
    } else {
        music.volume = music.dataset.lastVol || 0.5;
        localStorage.setItem("musicMuted", "false");
    }
    updateSliderUI(music.volume);
}

    window.onload = () => {

        particlesJS("particles-js", {

        setTimeout(() => { p.style.opacity = "0"; setTimeout(() => p.style.display = "none", 300); }, 1200);

    document.addEventListener("DOMContentLoaded", () => {
    // 1. ทำให้หน้าจอค่อยๆ ปรากฏขึ้นเมื่อโหลดเสร็จ
    document.body.classList.add("loaded");

    // 2. ดักจับการคลิกที่ลิงก์ใน Navbar
    const navLinks = document.querySelectorAll('nav a');
    
    navLinks.forEach(link => {
        link.addEventListener('click', function(e) {
            // ตรวจสอบว่าเป็นลิงก์ภายในเว็บไซต์ และไม่ใช่การเปิด Tab ใหม่
            if (this.hostname === window.location.hostname && !this.target) {
                e.preventDefault(); // หยุดการไปหน้าใหม่ทันที
                const targetUrl = this.href;

                // ค่อยๆ จางหน้าจอออก
                document.body.style.opacity = '0';

                // รอให้จางเสร็จ (0.5 วินาที) แล้วค่อยเปลี่ยนหน้า
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 500);
            }
        });
    });
});
