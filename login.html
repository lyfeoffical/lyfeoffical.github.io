<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ไลฟ์สไตล์.com</title>
  <link rel="icon" type="image/png" href="https://img1.pic.in.th/images/3004g.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Bebas+Neue&family=Sarabun:wght@300;400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #030303;
      --surface: rgba(255, 255, 255, 0.03);
      --surface-border: rgba(255, 255, 255, 0.08);
      --surface-hover: rgba(255, 255, 255, 0.07);
      --accent: #ffffff;
      --accent-glow: rgba(255, 255, 255, 0.3);
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.65);
      --text-dim: rgba(255, 255, 255, 0.35);
      --danger: #ff4757;
      --success: #2ed573;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    button,
    input,
    select,
    textarea,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    a,
    p,
    span,
    label,
    div {
      font-family: 'Kanit', sans-serif;
    }

    .fa-solid,
    .fas {
      font-family: "Font Awesome 6 Free" !important;
      font-weight: 900 !important;
    }

    .fa-brands,
    .fab {
      font-family: "Font Awesome 6 Brands" !important;
      font-weight: 400 !important;
    }

    .fa-regular,
    .far {
      font-family: "Font Awesome 6 Free" !important;
      font-weight: 400 !important;
    }

    body {
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 20px;
    }

    .bg-animation {
      position: fixed;
      inset: 0;
      z-index: -3;
      background: url('background.gif') center/cover no-repeat;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: rgba(3, 3, 3, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .bg-vignette {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at center, transparent 20%, rgba(3, 3, 3, 0.96) 100%);
      pointer-events: none;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 40px 32px;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 255, 255, 0.02);
      position: relative;
      animation: cardFadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--surface-border);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
      transition: transform 0.4s ease;
    }

    .brand-logo:hover {
      transform: scale(1.08);
    }

    .brand-logo img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .login-title {
      font-family: 'Kanit', sans-serif !important;
      font-weight: 700;
      font-size: 1.85rem;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .login-subtitle {
      font-size: 0.85rem;
      color: var(--text-sub);
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-sub);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i.prefix-icon {
      position: absolute;
      left: 16px;
      color: var(--text-dim);
      font-size: 0.95rem;
      pointer-events: none;
      transition: color 0.3s;
    }

    .form-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      padding: 14px 44px 14px 44px;
      color: #fff;
      font-size: 0.95rem;
      font-family: 'Kanit', sans-serif;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-input:focus {
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.65);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
    }

    .form-input:focus+i.prefix-icon {
      color: #fff;
    }

    .toggle-pass {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.95rem;
      padding: 4px;
      transition: color 0.2s;
    }

    .toggle-pass:hover {
      color: #fff;
    }

    .btn-submit {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      background: #ffffff;
      color: #030303;
      border: none;
      border-radius: 10px;
      font-family: 'Kanit', sans-serif !important;
      font-size: 1.15rem;
      letter-spacing: 1px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
    }

    .btn-submit:hover {
      background: #e6e6e6;
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 255, 255, 0.3);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: var(--text-dim);
      font-size: 0.85rem;
      text-decoration: none;
      letter-spacing: 1px;
      transition: color 0.3s;
    }

    .back-home:hover {
      color: #fff;
    }

    .back-home i {
      margin-right: 6px;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .alert-danger {
      background: rgba(255, 71, 87, 0.15);
      border: 1px solid rgba(255, 71, 87, 0.3);
      color: #ff6b81;
    }

    .alert-success {
      background: rgba(46, 213, 115, 0.15);
      border: 1px solid rgba(46, 213, 115, 0.3);
      color: #2ed573;
    }

    /* Captcha Section Styles */
    .captcha-box-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .captcha-display {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 2px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .captcha-display:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-refresh-captcha {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: var(--text-sub);
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: 1rem;
    }

    .btn-refresh-captcha:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.14);
      transform: rotate(45deg);
    }

    .shake {
      animation: shakeAnim 0.4s ease-in-out;
    }

    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 28px 18px;
        border-radius: 14px;
      }
      .brand-logo {
        width: 60px;
        height: 60px;
        margin-bottom: 12px;
      }
      .brand-logo img {
        width: 38px;
        height: 38px;
      }
      .login-title {
        font-size: 1.8rem;
        letter-spacing: 2px;
      }
      .login-subtitle {
        font-size: 0.8rem;
      }
      .captcha-box-wrapper {
        flex-wrap: wrap;
        gap: 8px;
      }
      .captcha-display {
        flex: 1;
        justify-content: center;
      }
      .captcha-box-wrapper .input-wrapper {
        width: 100%;
        flex: 1 1 100% !important;
      }
    }
  </style>
</head>

<body>

  <div class="bg-animation"></div>
  <div class="bg-overlay"></div>
  <div class="bg-vignette"></div>

  <div class="login-container">
    <div class="login-header">
      <div class="brand-logo">
        <img src="https://img1.pic.in.th/images/3004g.png" alt="LYFESTYLE">
      </div>
      <h1 class="login-title">ADMIN PANEL</h1>
      <p class="login-subtitle">ระบบจัดการสมาชิกและข้อมูลเว็บไซต์</p>
    </div>

    <div id="alertBox" class="alert alert-danger">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="alertMsg">รหัสผ่านไม่ถูกต้อง</span>
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="username">บัญชีผู้ใช้ (Username)</label>
        <div class="input-wrapper">
          <input type="text" id="username" class="form-input" placeholder="กรอกชื่อผู้ใช้..." required autofocus>
          <i class="fa-solid fa-user prefix-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">รหัสผ่าน (Password)</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-input" placeholder="กรอกรหัสผ่าน..." required>
          <i class="fa-solid fa-lock prefix-icon"></i>
          <button type="button" class="toggle-pass" id="togglePass" aria-label="แสดงรหัสผ่าน">
            <i class="fa-solid fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="captchaInput">ยืนยันรหัสความปลอดภัย (CAPTCHA)</label>
        <div class="captcha-box-wrapper" id="captchaBoxWrapper">
          <div class="captcha-display" id="captchaDisplay" title="คลิกเพื่อเปลี่ยนรหัสภาพ">
            <canvas id="captchaCanvas" width="120" height="44"></canvas>
          </div>
          <button type="button" class="btn-refresh-captcha" id="btnRefreshCaptcha" title="เปลี่ยนรหัสภาพใหม่">
            <i class="fa-solid fa-rotate-right"></i>
          </button>
          <div class="input-wrapper" style="flex: 1;">
            <input type="text" id="captchaInput" class="form-input" placeholder="พิมพ์รหัสที่เห็น..." maxlength="6" required autocomplete="off" style="text-transform: uppercase;">
            <i class="fa-solid fa-shield-halved prefix-icon"></i>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span>เข้าสู่ระบบ</span>
        <i class="fa-solid fa-arrow-right-to-bracket"></i>
      </button>
    </form>

    <a href="index.html" class="back-home">
      <i class="fa-solid fa-arrow-left"></i> กลับสู่หน้าหลัก
    </a>
  </div>

  <script>
    // ตรวจสอบเซสชัน หากล็อกอินอยู่แล้วให้พาไปหน้า admin.html ทันที
    const currentSession = sessionStorage.getItem("lyfe_admin_session") || localStorage.getItem("lyfe_admin_session");
    if (currentSession === "active") {
      window.location.replace("admin.html");
    }

    const loginForm = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const togglePassBtn = document.getElementById("togglePass");
    const eyeIcon = document.getElementById("eyeIcon");
    const alertBox = document.getElementById("alertBox");
    const alertMsg = document.getElementById("alertMsg");
    const submitBtn = document.getElementById("submitBtn");

    const captchaCanvas = document.getElementById("captchaCanvas");
    const captchaInput = document.getElementById("captchaInput");
    const btnRefreshCaptcha = document.getElementById("btnRefreshCaptcha");
    const captchaDisplay = document.getElementById("captchaDisplay");
    const captchaBoxWrapper = document.getElementById("captchaBoxWrapper");

    let currentCaptchaCode = "";

    // ฟังก์ชันสร้างรหัส CAPTCHA สุ่ม
    function generateCaptchaText(length = 5) {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // ละตัวที่สับสนง่าย เช่น 0, O, 1, I
      let result = "";
      for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    // ฟังก์ชันวาด CAPTCHA ลงบน Canvas ด้วยกราฟิกที่สวยงาม ปลอดภัย
    function renderCaptcha() {
      currentCaptchaCode = generateCaptchaText(5);
      const ctx = captchaCanvas.getContext("2d");
      const width = captchaCanvas.width;
      const height = captchaCanvas.height;

      // ล้างพื้นหลัง
      ctx.fillStyle = "#121214";
      ctx.fillRect(0, 0, width, height);

      // วาดเส้นลายจุดรบกวน (Noise Dots)
      for (let i = 0; i < 35; i++) {
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.25})`;
        ctx.beginPath();
        ctx.arc(Math.random() * width, Math.random() * height, Math.random() * 2, 0, Math.PI * 2);
        ctx.fill();
      }

      // วาดเส้นคลื่นรบกวน (Noise Lines)
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.15 + Math.random() * 0.15})`;
        ctx.lineWidth = 1 + Math.random();
        ctx.beginPath();
        ctx.moveTo(Math.random() * 20, Math.random() * height);
        ctx.bezierCurveTo(
          Math.random() * width, Math.random() * height,
          Math.random() * width, Math.random() * height,
          width - Math.random() * 20, Math.random() * height
        );
        ctx.stroke();
      }

      // วาดตัวอักษรแต่ละตัวแบบสุ่มองศาและความสูง
      const charArray = currentCaptchaCode.split("");
      const startX = 14;
      const space = (width - 28) / charArray.length;

      charArray.forEach((char, idx) => {
        ctx.save();
        const x = startX + idx * space + 6;
        const y = height / 2 + 7 + (Math.random() * 6 - 3);
        const angle = (Math.random() * 30 - 15) * Math.PI / 180;

        ctx.translate(x, y);
        ctx.rotate(angle);

        // สีตัวอักษรแบบเรืองแสง
        const colors = ["#ffffff", "#e0e0e0", "#00d2d3", "#f1f2f6", "#54a0ff"];
        ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
        ctx.font = "bold 22px 'Kanit', 'Arial', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowColor = "rgba(255, 255, 255, 0.4)";
        ctx.shadowBlur = 4;
        ctx.fillText(char, 0, 0);

        ctx.restore();
      });
    }

    // สร้าง Captcha ครั้งแรกเมื่อเปิดหน้า
    renderCaptcha();

    // กดปุ่มรีเฟรชหรือคลิกที่ภาพเพื่อเปลี่ยนรหัส
    btnRefreshCaptcha.addEventListener("click", () => {
      renderCaptcha();
      captchaInput.value = "";
    });
    captchaDisplay.addEventListener("click", () => {
      renderCaptcha();
      captchaInput.value = "";
    });

    // ซ่อน / แสดงรหัสผ่าน
    togglePassBtn.addEventListener("click", () => {
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eyeIcon.className = "fa-solid fa-eye-slash";
      } else {
        passwordInput.type = "password";
        eyeIcon.className = "fa-solid fa-eye";
      }
    });

    function showAlert(text, type = "danger") {
      alertBox.className = `alert alert-${type}`;
      alertBox.style.display = "flex";
      alertMsg.innerText = text;
    }

    function hideAlert() {
      alertBox.style.display = "none";
    }

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      hideAlert();

      // 1. ตรวจสอบรหัส CAPTCHA ก่อน
      const userCaptcha = captchaInput.value.trim().toUpperCase();
      if (userCaptcha !== currentCaptchaCode) {
        captchaBoxWrapper.classList.add("shake");
        setTimeout(() => captchaBoxWrapper.classList.remove("shake"), 400);
        showAlert("รหัสยืนยันความปลอดภัย (CAPTCHA) ไม่ถูกต้อง");
        captchaInput.value = "";
        captchaInput.focus();
        renderCaptcha();
        return;
      }

      // 2. ตรวจสอบชื่อผู้ใช้และรหัสผ่าน
      const user = usernameInput.value.trim();
      const pass = passwordInput.value;

      const storedUser = localStorage.getItem("lyfe_admin_user") || "admin";
      const storedPass = localStorage.getItem("lyfe_admin_pass") || "lyfe3004";

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>กำลังตรวจสอบ...</span> <i class="fa-solid fa-spinner fa-spin"></i>`;

      setTimeout(() => {
        if (user === storedUser && pass === storedPass) {
          showAlert("เข้าสู่ระบบสำเร็จ กำลังนำเข้าสู่ระบบหลังบ้าน...", "success");
          sessionStorage.setItem("lyfe_admin_session", "active");
          localStorage.setItem("lyfe_admin_session", "active");
          setTimeout(() => {
            window.location.href = "admin.html";
          }, 600);
        } else {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span>เข้าสู่ระบบ</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>`;
          showAlert("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");
          passwordInput.value = "";
          captchaInput.value = "";
          renderCaptcha();
          passwordInput.focus();
        }
      }, 400);
    });
  </script>
  <script src="site-features.js"></script>
</body>

</html>
