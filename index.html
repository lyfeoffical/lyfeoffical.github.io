  <style>
    :root {
      --bg-color: #080808;
      --surface-color: rgba(255, 255, 255, 0.05);
      --accent: #ffffff;
      --accent-glow: rgba(255, 255, 255, 0.2);
      --text: #ffffff;
      --text-dim: #bbb;
      --nav-font: 'Bebas Neue', sans-serif;
      --heading-font: 'Kanit', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: var(--bg-color);
      color: var(--text);
      font-family: 'Sarabun', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* 🔹 Background System (GIF + Blur) */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -3;
      /* เปลี่ยน 'background.gif' เป็นชื่อไฟล์ GIF ของคุณ */
      background: url('background.gif') center/cover no-repeat;
    }

    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      background: rgba(0, 0, 0, 0.6); /* ปรับความมืด */
      backdrop-filter: blur(6px); /* ปรับความเบลอตรงนี้ */
      -webkit-backdrop-filter: blur(12px);
    }

    .bg-vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.8) 100%);
    }

    /* 🔹 Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0e0e0e; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }

    /* 🔹 Navbar */
    header {
      background: rgba(8, 8, 8, 0.3);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 15px 5%;
      position: fixed;
      width: 100%;
      top: 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 1000;
      transition: 0.3s;
    }

    .navbar { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; }

    .logo img {
      height: 45px;
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }

    nav.nav-desktop ul {
      list-style: none;
      display: flex;
      gap: 35px;
    }

    nav a {
      color: var(--text-dim);
      text-decoration: none;
      font-family: var(--nav-font);
      font-size: 1.1rem;
      letter-spacing: 2px;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    nav a:hover, nav a.active {
      color: var(--accent);
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    /* 🔹 Hero Section */
    .hero {
      height: 75vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-top: 80px;
    }

    .hero h1 {
      font-family: var(--heading-font);
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      letter-spacing: 10px;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .highlight {
      color: transparent;
      -webkit-text-stroke: 1px #fff;
      filter: drop-shadow(0 0 15px rgba(255,255,255,0.3));
    }

    .hero-button {
      font-family: var(--nav-font);
      font-size: 1.2rem;
      color: #000;
      background: #fff;
      padding: 12px 45px;
      text-decoration: none;
      margin-top: 30px;
      border-radius: 2px;
      transition: 0.4s;
      letter-spacing: 3px;
    }

    .hero-button:hover {
      background: transparent;
      color: #fff;
      box-shadow: 0 0 25px rgba(255,255,255,0.4);
      outline: 1px solid #fff;
      transform: translateY(-5px);
    }

    /* 🔹 News Section */
    .latest-news {
      max-width: 1200px;
      margin: 50px auto 100px;
      padding: 0 20px;
    }

    .section-title {
      font-family: var(--heading-font);
      font-size: 2rem;
      letter-spacing: 4px;
      margin-bottom: 50px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .section-title::after {
      content: "";
      height: 1px;
      background: linear-gradient(90deg, var(--accent), transparent);
      flex-grow: 1;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
    }

    .news-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 15px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .news-card:hover {
      border-color: rgba(255,255,255,0.3);
      transform: translateY(-10px);
      background: rgba(255, 255, 255, 0.06);
    }

    .card-img {
      width: 100%;
      height: 200px;
      background: rgba(255,255,255,0.05) url('https://img2.pic.in.th/OVF.jpg') center/cover;
      transition: 0.5s;
    }

    .news-card:hover .card-img {
      transform: scale(1.05);
    }

        .card-img1 {
      width: 100%;
      height: 200px;
      background: rgba(255,255,255,0.05) url('https://img2.pic.in.th/588511780d269d1e7fa.jpg') center/cover;
      transition: 0.5s;
    }

    .news-card:hover .card-img1 {
      transform: scale(1.05);
    }


    .card-content {
      padding: 25px;
    }

    .card-category {
      display: inline-block;
      font-family: var(--nav-font);
      background: rgba(255,255,255,0.1);
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      margin-bottom: 15px;
      color: var(--accent);
    }

    .card-content h3 {
      font-family: var(--heading-font);
      font-size: 1.4rem;
      font-weight: 500;
      margin-bottom: 10px;
    }

    /* 🔹 Anti-Devtools Popup */
    #block-popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(15px);
      justify-content: center;
      align-items: center;
      z-index: 999999;
      opacity: 0;
      transition: 0.3s;
    }

    #block-popup .box {
      border: 1px solid #fff;
      color: #fff;
      padding: 30px 60px;
      border-radius: 0px;
      font-family: var(--nav-font);
      font-size: 2rem;
      letter-spacing: 5px;
      text-align: center;
      box-shadow: 0 0 50px rgba(255,255,255,0.1);
    }

    /* 🔹 Mobile Navigation */
    .hamburger {
      display: none;
      cursor: pointer;
      flex-direction: column;
      gap: 6px;
    }

    .hamburger span {
      width: 30px;
      height: 2px;
      background: #fff;
      transition: 0.3s;
    }

    .mobile-menu {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: rgba(8,8,8,0.98);
      backdrop-filter: blur(20px);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      z-index: 999;
    }

    .mobile-menu a {
      color: #fff;
      text-decoration: none;
      font-family: var(--nav-font);
      font-size: 2rem;
      letter-spacing: 4px;
    }

    @media (max-width: 768px) {
      nav.nav-desktop { display: none; }
      .hamburger { display: flex; z-index: 1001; }
      .hero h1 { font-size: 2.8rem; }
    }

    /* 🔹 Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero h1, .hero-button, .news-card {
      animation: fadeInUp 0.8s ease backwards;
    }

    .particle-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    .dot {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      filter: blur(1px);
      animation: fly 10s linear infinite;
    }

    @keyframes fly {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

.intro-overlay {
    position: fixed;
    inset: 0;
    background: #050505;
    z-index: 10000;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1), opacity 1s ease;
}

/* แสง Glow สีขาวจางๆ ตรงกลาง */
.intro-bg-glow {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
    filter: blur(50px);
    animation: pulseGlow 8s infinite alternate;
}

@keyframes pulseGlow {
    0% { transform: scale(1); opacity: 0.3; }
    100% { transform: scale(1.3); opacity: 0.6; }
}

.intro-content {
    position: relative;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
}

/* 🔹 Text Animations */
.intro-subtitle {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    letter-spacing: 8px;
    color: #888;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeInUp 1s ease forwards 0.3s;
}

.intro-title {
    font-family: 'Kanit', sans-serif;
    font-size: 5rem;
    font-weight: 700;
    letter-spacing: 15px;
    color: #fff;
    margin: 10px 0;
    opacity: 0;
    transform: translateY(30px);
    animation: fadeInUp 1s ease forwards 0.6s;
    text-shadow: 0 0 30px rgba(255,255,255,0.2);
}

.intro-line {
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, #fff, transparent);
    margin: 0 auto;
    animation: expandLine 1.5s ease forwards 0.8s;
}

/* 🔹 Stylish Button */
.enter-btn {
    position: relative;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 18px 45px;
    color: #fff;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 4px;
    cursor: pointer;
    overflow: hidden;
    transition: 0.5s;
    opacity: 0;
    animation: fadeInUp 1s ease forwards 1.2s;
}

.enter-btn:hover {
    border-color: #fff;
    box-shadow: 0 0 40px rgba(255,255,255,0.1);
    transform: scale(1.05);
}

/* แสงวิ่งผ่านปุ่ม */
.btn-shine {
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: 0.5s;
    animation: moveShine 3s infinite;
}

@keyframes moveShine {
    0% { left: -100%; }
    50% { left: 100%; }
    100% { left: 100%; }
}

/* 🔹 Keyframes */
@keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
}

@keyframes expandLine {
    to { width: 100%; }
}

/* เมื่อกดเข้าเว็บ ให้ Intro เลื่อนขึ้นด้านบน */
.intro-overlay.fade-out {
    transform: translateY(-100%);
    opacity: 0;
    pointer-events: none;
}

/* 🔹 Volume Container Main Style */
.volume-container {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 8px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 50px;
    width: 50px; /* ขนาดตอนเริ่มต้น */
    height: 50px;
    transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s;
    overflow: hidden;
    cursor: pointer;
}

/* เมื่อ Hover ให้ขยายออก */
.volume-container:hover {
    width: 200px; /* ความกว้างตอนขยาย */
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.2);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

.volume-content {
    display: flex;
    align-items: center;
    width: 100%;
    height: 100%;
}

/* 🔹 Icon Section */
.icon-box {
    min-width: 34px;
    height: 34px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    transition: 0.3s;
}

.icon-box i {
    color: #fff;
    font-size: 1.1rem;
    filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
}

/* 🔹 Slider Section */
.slider-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    padding-right: 15px;
    opacity: 0;
    transform: translateX(-10px);
    transition: 0.4s ease;
}

.volume-container:hover .slider-wrapper {
    opacity: 1;
    transform: translateX(0);
}

/* 🔹 Custom Range Input (The Slider) */
.volume-slider {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    outline: none;
    cursor: pointer;
    margin-left: 10px;
}

/* ส่วนของแถบที่ถูกลาก (สำหรับ Webkit) */
.volume-slider::-webkit-slider-runnable-track {
    width: 100%;
    height: 4px;
    border-radius: 10px;
}

/* ปุ่มกลมสำหรับลาก */
.volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    background: #fff;
    border-radius: 50%;
    margin-top: -5px; /* จัดให้อยู่กึ่งกลาง track */
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    transition: 0.2s;
}

.volume-slider::-webkit-slider-thumb:hover {
    transform: scale(1.2);
    background: #f0f0f0;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
}

/* สำหรับ Firefox */
.volume-slider::-moz-range-thumb {
    width: 14px;
    height: 14px;
    background: #fff;
    border: none;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

/* เอฟเฟกต์ตอนโหลดหน้าจอ */
body {
    opacity: 0;
    transition: opacity 0.6s ease-in-out;
}

body.loaded {
    opacity: 1;
}

/* Hover Effect ที่เมนูให้ดูสมูท */
nav ul li a {
    position: relative;
    padding-bottom: 5px;
    transition: color 0.3s ease;
}

nav ul li a::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 0;
    height: 2px;
    background: #fff;
    transition: all 0.3s ease;
    transform: translateX(-50%);
    box-shadow: 0 0 10px rgba(255,255,255,0.8);
}

nav ul li a:hover::after, 
nav ul li a.active::after {
    width: 100%;
}

nav ul li a:hover {
    color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
}
#fire-particles canvas {
    /* เพิ่มความสว่างและฟุ้งให้สะเก็ดไฟสีขาว */
    filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.8)) blur(0.5px);

/* ปรับ Background Glow ด้านล่างให้เป็นสีขาว-เทา */
.intro-bg-glow {

/* เพิ่ม Effect ให้ตัวหนังสือดูเข้ากับไฟสีขาว */
.intro-title {
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.4), 0 0 40px rgba(255, 255, 255, 0.2);
    color: #fff;
}
  </style>

  <script>

                    // ระบบป้องกันการเปิดดูโค้ดและเซฟหน้าเว็บ (อัปเดตใหม่)
document.addEventListener('keydown', function(e) {
    // 1. ป้องกัน Ctrl + S (Save Page)
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.keyCode === 83)) {
        e.preventDefault();
        // showAlert("ไม่อนุญาตให้บันทึกหน้าเว็บ", "danger"); // เปิดใช้ถ้าต้องการให้แจ้งเตือน
        return false;
    }

    // 2. ป้องกัน F12 (DevTools)
    if (e.key === 'F12' || e.keyCode === 123) {
        e.preventDefault();
        return false;
    }

    // 3. ป้องกัน Ctrl + Shift + I / J / C (Inspect/Console)
    if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
        e.preventDefault();
        return false;
    }

    // 4. ป้องกัน Ctrl + U (View Source)
    if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U' || e.keyCode === 85)) {
        e.preventDefault();
        return false;
    }
}, false);

// 5. ป้องกันการคลิกขวา (Context Menu)
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
}, false);
const music = document.getElementById("bgMusic");
const volSlider = document.getElementById("volSlider");
const volIcon = document.getElementById("volIcon");

// 🔹 ฟังก์ชันเริ่มต้นประสบการณ์ (กด ENTER)
function startExperience() {
    music.volume = 0.5;
    music.play();
    
    // อัปเดตสีแถบเสียงเริ่มต้น
    updateSliderBackground(0.5);

    const intro = document.getElementById("intro-overlay");
    intro.classList.add("fade-out");
    
    setTimeout(() => {
        document.body.style.overflow = "auto";
        const main = document.getElementById("main-wrapper");
        if(main) main.style.opacity = "1";
    }, 1000);
}

// 🔹 ระบบควบคุมเสียง (Volume Control)
volSlider.addEventListener("input", (e) => {
    const val = e.target.value;
    music.volume = val;
    updateIcon(val);
    updateSliderBackground(val);
});

// อัปเดตไอคอนลำโพงตามระดับเสียง
function updateIcon(val) {
    if (val == 0) volIcon.className = "fa-solid fa-volume-xmark";
    else if (val < 0.5) volIcon.className = "fa-solid fa-volume-low";
    else volIcon.className = "fa-solid fa-volume-high";
}

// อัปเดตสี Background ของ Slider ให้วิ่งตามนิ้ว
function updateSliderBackground(val) {
    const percentage = val * 100;
    volSlider.style.background = `linear-gradient(90deg, #fff ${percentage}%, rgba(255,255,255,0.1) ${percentage}%)`;
}

// เปิด-ปิดเสียง (Mute/Unmute)
function toggleMute() {
    if (music.volume > 0) {
        music.dataset.oldVol = music.volume;
        music.volume = 0;
        volSlider.value = 0;
    } else {
        music.volume = music.dataset.oldVol || 0.5;
        volSlider.value = music.volume;
    }
    updateIcon(music.volume);
    updateSliderBackground(volSlider.value);
}

// 🔹 Mobile Menu Logic
function toggleMenu() {
    const menu = document.getElementById("mobileMenu");
    const burgerSpans = document.querySelectorAll(".hamburger span");
    
    if (menu.style.display === "flex") {
        menu.style.display = "none";
        burgerSpans.forEach(span => span.style.transform = "none");
        burgerSpans[1].style.opacity = "1";
    } else {
        menu.style.display = "flex";
        burgerSpans[0].style.transform = "rotate(45deg) translate(5px, 6px)";
        burgerSpans[1].style.opacity = "0";
        burgerSpans[2].style.transform = "rotate(-45deg) translate(5px, -6px)";
    }
}

// 🔹 Security: Anti-Devtools & Right Click
document.addEventListener('contextmenu', e => {
    e.preventDefault();
    showBlockPopup();
});

document.onkeydown = function(e) {
    // Block F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
    if (e.keyCode == 123 || 
        (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || 
        (e.ctrlKey && e.keyCode == 85)) {
        showBlockPopup();
        return false;
    }
};

function showBlockPopup() {
    const popup = document.getElementById("block-popup");
    if(!popup) return;
    popup.style.display = "flex";
    setTimeout(() => popup.style.opacity = "1", 10);
    setTimeout(() => {
        popup.style.opacity = "0";
        setTimeout(() => popup.style.display = "none", 300);
    }, 1500);
}

document.addEventListener("DOMContentLoaded", () => {
    // 1. ทำให้หน้าจอค่อยๆ ปรากฏขึ้นเมื่อโหลดเสร็จ
    document.body.classList.add("loaded");

    // 2. ดักจับการคลิกที่ลิงก์ใน Navbar
    const navLinks = document.querySelectorAll('nav a');
    
    navLinks.forEach(link => {
        link.addEventListener('click', function(e) {
            // ตรวจสอบว่าเป็นลิงก์ภายในเว็บไซต์ และไม่ใช่การเปิด Tab ใหม่
            if (this.hostname === window.location.hostname && !this.target) {
                e.preventDefault(); // หยุดการไปหน้าใหม่ทันที
                const targetUrl = this.href;

                // ค่อยๆ จางหน้าจอออก
                document.body.style.opacity = '0';

                // รอให้จางเสร็จ (0.5 วินาที) แล้วค่อยเปลี่ยนหน้า
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 500);
            }
        });
    });
});

// 🔹 Header Scroll Effect
window.addEventListener('scroll', () => {
    const header = document.getElementById('mainHeader');
    if(!header) return;
    if (window.scrollY > 50) {
        header.style.padding = '10px 5%';
        header.style.background = 'rgba(8, 8, 8, 0.95)';
    } else {
        header.style.padding = '15px 5%';
        header.style.background = 'rgba(8, 8, 8, 0.3)';
    }
});
  </script>
