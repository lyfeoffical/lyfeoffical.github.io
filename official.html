  <style>
    :root {
      --bg-color: #0e0e0e;
      --surface-color: #181818;
      --accent: #fffbfb;
      --accent-glow: rgba(168, 168, 168, 0.3);
      --text: #fff;
      --text-dim: #bbb;
      --heading-font: 'Kanit', sans-serif;
      --body-font: 'Sarabun', sans-serif;
      --nav-font: 'Bebas Neue', sans-serif;
    }

    * {
      margin: 0; padding: 0;
      box-sizing: border-box;
      font-family: var(--body-font);
    }

    body {
      background: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
    }
    
    header {
      background: rgba(14,14,14,0.85);
      backdrop-filter: blur(12px);
      padding: 12px 50px;
      position: sticky;
      top: 0;
      border-bottom: 1px solid #2a2a2a;
      z-index: 10;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo img {
      height: 40px;
      filter: drop-shadow(0 0 10px var(--accent-glow));
      transition: 0.3s;
    }
    .logo img:hover { transform: scale(1.05); }

    nav ul {
      list-style: none;
      display: flex;
      gap: 40px;
    }

    nav a {
      color: #ccc;
      font-family: var(--nav-font);
      text-decoration: none;
      font-size: 1.3rem;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
      transition: 0.3s;
    }

    nav a::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0%;
      height: 2px;
      background: var(--accent);
      transition: width 0.3s;
    }

    nav a:hover,
    nav a.active { color: #fff; }

    nav a:hover::after,
    nav a.active::after { width: 100%; }


    h1.title { text-align:center; font-size:3rem; margin:40px 0; font-family: var(--heading-font); }
    .highlight { color: var(--accent); text-shadow: 0 0 15px var(--accent-glow); }

    h2.title { text-align:center; font-size:1rem; margin:5px 0; font-family: var(--heading-font); }
    .highlight { color: var(--accent); text-shadow: 0 0 15px var(--accent-glow); }

    .official-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 80px;
      justify-content: center;
    }
    .official-card {
      flex: 0 1 250px; /* กำหนดขนาดขั้นต่ำ 250px */
    }


    .official-card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 15px;
      padding: 20px;
      text-align:center;
      border: 1px solid rgba(255,255,255,0.17);
      box-shadow: 0 0 20px rgba(255,255,255,0.08);
      transition: 0.3s;
    }

    .official-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 25px var(--accent-glow);
    }

    .official-card i {
      font-size: 40px;
      margin-bottom: 10px;
      color: var(--accent);
    }

    .official-card a {
      display:block;
      margin-top:10px;
      padding:8px 12px;
      background: #1877f2;
      color:#fff;
      border-radius:8px;
      text-decoration:none;
      transition:0.3s;
    }

    .official-card a.discord { background: #ae87bb; }
    .official-card a.member { background: #3e3e3e; }
    .official-card a.youtube { background: #ff0000; }
    .official-card a.tiktok { background: #010101; }
    .official-card a:hover { opacity:0.8; }

    footer { text-align:center; margin:40px 0; color:#777; font-size:14px; }
  </style>
