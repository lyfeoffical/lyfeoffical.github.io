<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ไลฟ์สไตล์.com</title>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&family=Bebas+Neue&family=Sarabun:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #080808;
      --surface-color: rgba(255, 255, 255, 0.05);
      --accent: #ffffff;
      --text: #ffffff;
      --text-dim: #bbb;
      --nav-font: 'Bebas Neue', sans-serif;
      --heading-font: 'Kanit', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: var(--bg-color);
      color: var(--text);
      font-family: 'Sarabun', sans-serif;
      overflow-x: hidden;
      opacity: 0; /* สำหรับ Fade-in */
      transition: opacity 0.6s ease-in-out;
    }

    body.loaded { opacity: 1; }

    /* 🔹 Background System */
    .bg-animation { position: fixed; inset: 0; z-index: -3; background: url('background.gif') center/cover no-repeat; }
    .bg-overlay { position: fixed; inset: 0; z-index: -2; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); }

    /* 🔹 Header & Navbar */
    header {
      background: rgba(8, 8, 8, 0.5);
      backdrop-filter: blur(20px);
      padding: 15px 5%;
      position: fixed; width: 100%; top: 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 1000;
    }

    .navbar { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; }
    .logo img { height: 40px; }
    
    nav.nav-desktop ul { list-style: none; display: flex; gap: 35px; }
    nav.nav-desktop a { 
        color: var(--text-dim); text-decoration: none; font-family: var(--nav-font); 
        font-size: 1.1rem; letter-spacing: 2px; transition: 0.3s; position: relative;
    }
    nav.nav-desktop a::after {
        content: ''; position: absolute; bottom: -5px; left: 50%; width: 0; height: 2px;
        background: #fff; transition: 0.3s; transform: translateX(-50%);
    }
    nav.nav-desktop a:hover::after, nav.nav-desktop a.active::after { width: 100%; }
    nav.nav-desktop a:hover, nav.nav-desktop a.active { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }

    /* 🔹 Hamburger Menu */
    .hamburger { display: none; cursor: pointer; flex-direction: column; gap: 6px; z-index: 1100; }
    .hamburger span { width: 30px; height: 2px; background: #fff; transition: 0.3s; }
    .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 6px); }
    .hamburger.active span:nth-child(2) { opacity: 0; }
    .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -6px); }

    .mobile-menu {
      position: fixed; top: 0; right: -100%; width: 100%; height: 100vh;
      background: rgba(8, 8, 8, 0.98); backdrop-filter: blur(15px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 30px; transition: 0.5s cubic-bezier(0.77, 0, 0.175, 1); z-index: 1050;
    }
    .mobile-menu.active { right: 0; }
    .mobile-menu a { color: #fff; font-family: var(--nav-font); font-size: 2rem; text-decoration: none; letter-spacing: 5px; }

    /* 🔹 Official Content */
    .container { max-width: 1200px; margin: 150px auto 100px; padding: 0 30px; }
    .title-section h1 { font-family: 'Bebas Neue'; font-size: clamp(3rem, 8vw, 4.5rem); letter-spacing: 15px; text-align: center; margin-bottom: 10px; }
    .underline-glow { width: 100px; height: 3px; background: #fff; margin: 0 auto 60px; box-shadow: 0 0 20px #fff; }

    .official-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
    }

    .official-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      transition: 0.4s ease;
      backdrop-filter: blur(10px);
    }

    .official-card:hover {
      transform: translateY(-10px);
      background: rgba(255, 255, 255, 0.08);
      border-color: #fff;
    }

    .official-card i { font-size: 3rem; margin-bottom: 20px; color: #fff; }
    .official-card h3 { font-family: 'Kanit'; font-size: 1.5rem; margin-bottom: 20px; letter-spacing: 2px; }
    
    .official-link {
      display: inline-block;
      background: #fff;
      color: #000;
      text-decoration: none;
      padding: 12px 30px;
      border-radius: 50px;
      font-family: 'Bebas Neue';
      font-size: 1.1rem;
      transition: 0.3s;
    }

    .official-link:hover {
      background: transparent;
      color: #fff;
      box-shadow: inset 0 0 0 1px #fff;
    }

    /* 🔹 Volume UI */
    .volume-container {
        position: fixed; bottom: 30px; right: 30px; z-index: 1001;
        display: flex; align-items: center; padding: 8px;
        background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50px;
        width: 50px; height: 50px; transition: 0.5s; overflow: hidden;
    }
    .volume-container:hover { width: 200px; }
    .vol-icon-box { min-width: 34px; text-align: center; cursor: pointer; }
    .volume-slider { -webkit-appearance: none; width: 100%; height: 4px; background: rgba(255,255,255,0.1); outline: none; margin: 0 15px; cursor: pointer; }

    /* 🔹 Block Popup */
    #block-popup { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; justify-content: center; align-items: center; opacity: 0; transition: 0.3s; }
    #block-popup .box { background: #fff; color: #000; padding: 20px 40px; font-family: 'Bebas Neue'; font-size: 1.5rem; }

    @media (max-width: 768px) {
      nav.nav-desktop { display: none; }
      .hamburger { display: flex; }
    }
  </style>
</head>
<body>

  <div class="bg-animation"></div>
  <div class="bg-overlay"></div>
  <div id="block-popup"><div class="box">ACCESS DENIED</div></div>

  <header>
    <div class="navbar">
      <div class="logo"><img src="https://img5.pic.in.th/file/secure-sv1/ChatGPT_Image_Sep_20_2025_02_07_49_AM.png" alt="Logo"></div>
      <nav class="nav-desktop">
        <ul>
          <li><a href="index.html">HOME</a></li>
          <li><a href="members.html">MEMBERS</a></li>
          <li><a href="official.html" class="active">OFFICIAL</a></li>
        </ul>
      </nav>
      <div class="hamburger" id="hamburgerBtn">
        <span></span><span></span><span></span>
      </div>
    </div>
  </header>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">HOME</a>
    <a href="members.html">MEMBERS</a>
    <a href="official.html">OFFICIAL</a>
  </div>

  <div class="container">
    <div class="title-section">
      <h1>OFFICIAL LINKS</h1>
      <div class="underline-glow"></div>
    </div>

    <div class="official-grid">
      <div class="official-card">
        <i class="fa-brands fa-facebook"></i>
        <h3>FACEBOOK</h3>
        <a href="https://web.facebook.com/Lyfe3004" target="_blank" class="official-link">VISIT PAGE</a>
      </div>

      <div class="official-card">
        <i class="fa-brands fa-youtube"></i>
        <h3>YOUTUBE</h3>
        <a href="https://www.youtube.com/@lyfe3004" target="_blank" class="official-link">SUBSCRIBE</a>
      </div>

      <div class="official-card">
        <i class="fa-brands fa-youtube"></i>
        <h3>YOUTUBE</h3>
        <a href="https://www.youtube.com/@Tzzfstyle" target="_blank" class="official-link">SUBSCRIBE</a>
      </div>
    </div>
  </div>

  <div class="volume-container">
      <div class="vol-icon-box" id="muteBtn"><i class="fa-solid fa-volume-high" id="volIcon"></i></div>
      <input type="range" class="volume-slider" id="volSlider" min="0" max="1" step="0.01" value="0.5">
  </div>

  <audio id="bgMusic" loop src="music.mp3"></audio>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    // 🔹 Mobile Menu Logic
    const hamburger = document.getElementById('hamburgerBtn');
    const mobileMenu = document.getElementById('mobileMenu');

    hamburger.onclick = () => {
        hamburger.classList.toggle('active');
        mobileMenu.classList.toggle('active');
        document.body.style.overflow = mobileMenu.classList.contains('active') ? 'hidden' : 'auto';
    };

    // 🔹 Smooth Page Transition
    document.addEventListener("DOMContentLoaded", () => {
        document.body.classList.add("loaded");
        const links = document.querySelectorAll('nav a, .mobile-menu a');
        
        links.forEach(link => {
            link.onclick = function(e) {
                if (this.hostname === window.location.hostname && !this.target) {
                    e.preventDefault();
                    const url = this.href;
                    document.body.style.opacity = '0';
                    setTimeout(() => { window.location.href = url; }, 500);
                }
            };
        });
    });

    // 🔹 Persistent Audio Logic
    const music = document.getElementById("bgMusic");
    const volSlider = document.getElementById("volSlider");
    const volIcon = document.getElementById("volIcon");

    function updateAudioUI(v) {
        const p = v * 100;
        if(volSlider) {
            volSlider.value = v;
            volSlider.style.background = `linear-gradient(90deg, #fff ${p}%, rgba(255,255,255,0.1) ${p}%)`;
        }
        volIcon.className = v == 0 ? "fa-solid fa-volume-xmark" : v < 0.5 ? "fa-solid fa-volume-low" : "fa-solid fa-volume-high";
    }

    window.addEventListener("load", () => {
        const savedTime = localStorage.getItem("musicTime");
        const savedVol = localStorage.getItem("musicVol") || 0.5;
        const isMuted = localStorage.getItem("musicMuted") === "true";

        if (savedTime) music.currentTime = parseFloat(savedTime);
        music.volume = isMuted ? 0 : parseFloat(savedVol);
        updateAudioUI(music.volume);

        music.play().catch(() => {
            document.addEventListener('click', () => music.play(), { once: true });
        });

        particlesJS("particles-js", {
          "particles": { "number": { "value": 50 }, "color": { "value": "#ffffff" }, "opacity": { "value": 0.1 }, "size": { "value": 2 }, "line_linked": { "enable": true, "distance": 150, "opacity": 0.05 }, "move": { "enable": true, "speed": 1 } }
        });
    });

    setInterval(() => { if(!music.paused) localStorage.setItem("musicTime", music.currentTime); }, 1000);

    volSlider.oninput = (e) => {
        music.volume = e.target.value;
        localStorage.setItem("musicVol", music.volume);
        updateAudioUI(music.volume);
    };

    document.getElementById('muteBtn').onclick = () => {
        if (music.volume > 0) {
            music.dataset.lastVol = music.volume;
            music.volume = 0;
            localStorage.setItem("musicMuted", "true");
        } else {
            music.volume = music.dataset.lastVol || 0.5;
            localStorage.setItem("musicMuted", "false");
        }
        updateAudioUI(music.volume);
    };

                    // ระบบป้องกันการเปิดดูโค้ดและเซฟหน้าเว็บ (อัปเดตใหม่)
document.addEventListener('keydown', function(e) {
    // 1. ป้องกัน Ctrl + S (Save Page)
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.keyCode === 83)) {
        e.preventDefault();
        // showAlert("ไม่อนุญาตให้บันทึกหน้าเว็บ", "danger"); // เปิดใช้ถ้าต้องการให้แจ้งเตือน
        return false;
    }

    // 2. ป้องกัน F12 (DevTools)
    if (e.key === 'F12' || e.keyCode === 123) {
        e.preventDefault();
        return false;
    }

    // 3. ป้องกัน Ctrl + Shift + I / J / C (Inspect/Console)
    if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
        e.preventDefault();
        return false;
    }

    // 4. ป้องกัน Ctrl + U (View Source)
    if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U' || e.keyCode === 85)) {
        e.preventDefault();
        return false;
    }
}, false);

// 5. ป้องกันการคลิกขวา (Context Menu)
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
}, false);

    // Security
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = function(e) {
      if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) return false;
    };
  </script>
</body>
</html>
