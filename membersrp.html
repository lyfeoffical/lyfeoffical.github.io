/* 🎧 Elegant Music Player */

.music-cover {

  animation: rotateCover 4s linear infinite paused;
}

/* หมุนปกตอนเล่นเพลง */
@keyframes rotateCover {

  100% { transform: rotate(360deg); }
}

/* 🔹 ปุ่ม Hamburger */
.hamburger {
  display: none;
  width: 32px;
  height: 22px;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  z-index: 9999;
}

.hamburger span {
  display: block;
  height: 4px;
  background: white;
  border-radius: 4px;
  transition: 0.4s;
}

/* เปิดเมนู → เปลี่ยนรูปเป็นกากบาท */
.hamburger.active span:nth-child(1) {
  transform: translateY(9px) rotate(45deg);
}
.hamburger.active span:nth-child(2) {
  opacity: 0;

.hamburger.active span:nth-child(3) {

const music = document.getElementById("music");
const playPause = document.getElementById("playPause");
const cover = document.getElementById("cover");
const trackBar = document.getElementById("trackBar");

// ▶ Play / Pause
playPause.addEventListener("click", () => {
  if (music.paused) {
    music.play();
    playPause.classList.replace("fa-play", "fa-pause");
    cover.style.animationPlayState = "running";
  } else {
    music.pause();
    playPause.classList.replace("fa-pause", "fa-play");
    cover.style.animationPlayState = "paused";
  }
});

// ⏱ Track Progress
music.addEventListener("timeupdate", () => {
  trackBar.value = (music.currentTime / music.duration) * 100;
});

// 🔘 Seek
trackBar.addEventListener("input", () => {
  music.currentTime = (trackBar.value / 100) * music.duration;
});

document.onkeydown = function(e) {
    if (e.keyCode == 123 ||
        (e.ctrlKey && e.shiftKey && e.keyCode == 73) ||
        (e.ctrlKey && e.shiftKey && e.keyCode == 74) ||
        (e.ctrlKey && e.keyCode == 85)) {

        showBlockPopup();
        return false;
    }
};

document.addEventListener('contextmenu', e => {
    e.preventDefault();
    showBlockPopup();
});

function showBlockPopup() {
    let popup = document.getElementById("block-popup");
    popup.style.display = "flex";

    setTimeout(() => {
        popup.style.opacity = "1";
    }, 10);

    setTimeout(() => {
        popup.style.opacity = "0";
        setTimeout(() => popup.style.display = "none", 400);
    }, 2000);
}

const musicPlayer = document.getElementById("musicPlayer");
const toggleBtn = document.getElementById("toggleBtn");

toggleBtn.addEventListener("click", () => {
    musicPlayer.classList.toggle("hidden");

    // เปลี่ยนไอคอนตามสถานะ
    const icon = toggleBtn.querySelector("i");
    if(musicPlayer.classList.contains("hidden")) {
        icon.classList.replace("fa-angle-left", "fa-angle-right");
    } else {
        icon.classList.replace("fa-angle-right", "fa-angle-left");
    }
});

function toggleMenu() {
  const menu = document.getElementById("mobileMenu");
  const burger = document.querySelector(".hamburger");

  if (menu.style.display === "flex") {
    menu.style.display = "none";
    burger.classList.remove("active");
  } else {
    menu.style.display = "flex";
    burger.classList.add("active");
  }
}
